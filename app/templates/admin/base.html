<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin - TheFinanceCompany{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/styles.css?v=20260717-admin-orders-polish">
</head>
<body>
    <div class="d-flex" style="min-height: 100vh;">
        <nav class="d-flex flex-column flex-shrink-0 p-3 text-white" style="width: 250px; background-color: #0B1F33;">
            <a href="/admin" class="d-flex align-items-center mb-3 text-white text-decoration-none fw-bold fs-5">
                <i class="bi bi-graph-up-arrow me-2"></i>TFC Admin
            </a>
            <hr style="border-color: rgba(255,255,255,0.1);">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/admin" class="nav-link text-white {% if request.url.path == '/admin' %}active bg-primary{% endif %}">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                </li>
                <li>
                    <a href="/admin/products" class="nav-link text-white {% if '/admin/products' in request.url.path %}active bg-primary{% endif %}">
                        <i class="bi bi-box me-2"></i>Products
                    </a>
                </li>
                <li>
                    <a href="/admin/orders" class="nav-link text-white {% if '/admin/orders' in request.url.path %}active bg-primary{% endif %}">
                        <i class="bi bi-cart me-2"></i>Orders
                    </a>
                </li>
                <li>
                    <a href="/admin/inquiries" class="nav-link text-white {% if '/admin/inquiries' in request.url.path %}active bg-primary{% endif %}">
                        <i class="bi bi-envelope me-2"></i>Inquiries
                    </a>
                </li>
            </ul>
            <hr style="border-color: rgba(255,255,255,0.1);">
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-2 fs-5"></i>
                    <strong>{{ user.full_name or user.email }}</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="/"><i class="bi bi-house me-2"></i>View Site</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                </ul>
            </div>
        </nav>

        <div class="flex-grow-1 p-4" style="background: #F8FAFC;">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.getElementById('logoutBtn')?.addEventListener('click', function(e) {
        e.preventDefault();
        fetch('/api/auth/logout', { method: 'POST' }).then(function() {
            window.location.href = '/admin/login';
        });
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
